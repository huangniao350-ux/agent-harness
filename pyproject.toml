[project]
name = "agent-harness"
version = "0.1.0"
description = "AgentHarness - 企业级 Agent 平台核心能力演示：ReAct/Plan-and-Execute 双模式 Harness、Multi-Agent 协同、统一 Tool Registry + MCP、三层 Memory、Guardrails、Trace/Replay 评估"
requires-python = ">=3.10"
readme = "README.md"
# 核心零依赖：仅使用 Python 标准库（asyncio/sqlite3/json/urllib 等）
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0"]

[project.scripts]
agent-harness = "agent_harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
